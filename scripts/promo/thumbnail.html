<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube thumbnail, 1280x720. Render: headless Chrome screenshot (see hackathon-video skill). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { position: relative; background: radial-gradient(circle at 26% 55%, #3a2412 0%, #170d06 62%); font-family: Inter, sans-serif; }
  .bird { position: absolute; left: -10px; top: 20px; height: 720px; filter: drop-shadow(0 24px 40px rgba(0,0,0,.5)); }
  .copy { position: absolute; left: 520px; top: 62px; width: 720px; }
  .kicker { font: 700 24px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #f0b27a; }
  h1 { font: 800 92px/0.98 Fraunces, serif; color: #fbf3e4; letter-spacing: -.01em; margin-top: 14px; }
  h1 em { font-style: normal; color: #2fd27a; }
  .note { position: absolute; left: 520px; top: 432px; width: 700px; padding: 20px 24px; border-radius: 24px; display: flex; gap: 18px;
    background: #fff; box-shadow: 0 24px 50px rgba(0,0,0,.45); font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .note .face { width: 64px; height: 64px; border-radius: 50%; flex: none; background: #fff6d9 center / cover no-repeat; }
  .note b { font-size: 24px; color: #111; }
  .note .when { float: right; font-size: 20px; color: #888; }
  .note p { font-size: 25px; line-height: 1.3; color: #222; margin-top: 4px; }
  .badge { position: absolute; left: 520px; top: 620px; display: flex; gap: 14px; }
  .badge span { padding: 10px 18px; border-radius: 14px; font: 700 24px Inter, sans-serif; }
  .b1 { background: #2fd27a; color: #08210f; }
  .b2 { background: rgba(251,243,228,.12); color: #fbf3e4; border: 2px solid rgba(251,243,228,.25); }
</style>
</head>
<body>
  <img class="bird" src="BIRD">
  <div class="copy">
    <div class="kicker">AI host · built on AWS</div>
    <h1>He answers my <em>WhatsApp</em> bookings</h1>
  </div>
  <div class="note">
    <div class="face" id="face"></div>
    <div>
      <b>Don Tuco · Finca Montezuma</b><span class="when">now</span>
      <p>¿A qué hora les gustaría venir el sábado 31? Tenemos horarios a las 11:00 y a las 14:00.</p>
    </div>
  </div>
  <div class="badge"><span class="b1">8 s median reply</span><span class="b2">ES · EN · NL</span></div>
<script>
  const a = new URLSearchParams(location.search).get('assets');
  document.querySelector('.bird').src = `file://${a}/don-tuco-cutout.png`;
  document.getElementById('face').style.backgroundImage = `url(file://${a}/don-tuco-avatar-192.png)`;
</script>
</body>
</html>
